app = "sidra-api"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DATABASE_URL = "file:/data/sidra.db"
  JWT_ISSUER = "sidra"
  JWT_ACCESS_TTL_SECONDS = "3600"
  ALLOW_PROVIDER_SELF_REGISTER = "false"
  R2_ENDPOINT = "https://e9a3c1b023e2b538e16ac5e846b4d947.r2.cloudflarestorage.com"

[mounts]
  source = "sidra_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 150

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
