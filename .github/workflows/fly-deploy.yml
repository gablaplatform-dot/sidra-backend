name: Deploy Backend To Fly

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fly-deploy.yml"
      - "Dockerfile"
      - "fly.toml"
      - "package.json"
      - "package-lock.json"
      - "prisma/**"
      - "scripts/**"
      - "src/**"
  workflow_dispatch:

concurrency:
  group: fly-deploy-main
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Lint And Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Ensure Fly Token Exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "Missing GitHub Actions secret: FLY_API_TOKEN"
            exit 1
          fi

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy To Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
